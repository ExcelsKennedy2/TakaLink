<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taka AI | TakaLink</title>
</head>

<body>

    <h1>🤖 Taka AI</h1>

    <p>
        Your TakaLink assistant.
        Ask me about waste collection, recycling,
        Green Points, waste reporting, or collection status.
    </p>

    <hr>

    <div id="chat-box">

        <p>
            <strong>Taka AI:</strong>
            Hi! I'm Taka AI. How can I help you today?
        </p>

    </div>

    <form id="chat-form">

        <input
            type="text"
            id="question"
            name="question"
            placeholder="Ask Taka AI..."
            required
        >

        <button type="submit">
            Send
        </button>

    </form>

    <p>
        <a href="{% url 'resident_dashboard' %}">
            Back to Dashboard
        </a>
    </p>


    <script>

        const chatForm = document.getElementById("chat-form");
        const questionInput = document.getElementById("question");
        const chatBox = document.getElementById("chat-box");


        chatForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const question = questionInput.value.trim();

            if (!question) {
                return;
            }


            // Display the resident's question
            const userMessage = document.createElement("p");

            userMessage.innerHTML =
                "<strong>You:</strong> " + question;

            chatBox.appendChild(userMessage);


            // Send the question to Django
            const formData = new FormData();

            formData.append("question", question);


            try {

                const response = await fetch(
                    "{% url 'taka_ai' %}",
                    {
                        method: "POST",
                        body: formData,
                        headers: {
                            "X-CSRFToken": getCookie("csrftoken")
                        }
                    }
                );


                const data = await response.json();


                if (data.answer) {

                    const aiMessage = document.createElement("p");

                    aiMessage.innerHTML =
                        "<strong>Taka AI:</strong> " + data.answer;

                    chatBox.appendChild(aiMessage);

                } else {

                    const errorMessage = document.createElement("p");

                    errorMessage.innerHTML =
                        "<strong>Taka AI:</strong> " +
                        (data.error || "Something went wrong.");

                    chatBox.appendChild(errorMessage);
                }


            } catch (error) {

                const errorMessage = document.createElement("p");

                errorMessage.innerHTML =
                    "<strong>Taka AI:</strong> " +
                    "Sorry, I couldn't process your question.";

                chatBox.appendChild(errorMessage);

            }


            questionInput.value = "";
            questionInput.focus();

        });


        // Get Django's CSRF token
        function getCookie(name) {

            let cookieValue = null;

            if (document.cookie && document.cookie !== "") {

                const cookies = document.cookie.split(";");

                for (let cookie of cookies) {

                    cookie = cookie.trim();

                    if (cookie.startsWith(name + "=")) {

                        cookieValue = decodeURIComponent(
                            cookie.substring(name.length + 1)
                        );

                        break;
                    }
                }
            }

            return cookieValue;
        }

    </script>

</body>
</html>
